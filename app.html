<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aymora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/app.css">
    <script>
        const storedTheme = localStorage.getItem('theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (storedTheme === 'light' || (!storedTheme && prefersLight)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
    <style>
        .match-card { text-align: center; }
        .match-card .core-values { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0 24px; }
        .match-card .core-values span {
            background: rgba(255, 77, 109, 0.08); border: 1px solid var(--border-color);
            border-radius: 99px; padding: 6px 14px; font-size: 0.8rem; color: var(--text-muted);
        }
        .match-actions { display: flex; gap: 12px; margin-top: 24px; }
        .match-actions .btn { flex: 1; }

        .match-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-radius: 14px; cursor: pointer;
            border: 1px solid var(--border-color); margin-bottom: 10px;
        }
        .match-list-item:hover { background: var(--card-hover); }

        .messages-pane { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 8px 4px; margin-bottom: 20px; }
        .message-bubble { max-width: 75%; padding: 10px 16px; border-radius: 16px; font-size: 0.92rem; }
        .message-mine { align-self: flex-end; background: var(--accent-rose); color: #fff; }
        .message-theirs { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border-color); }
        .message-form { display: flex; gap: 10px; }
        .message-form input { flex: 1; }

        .toggle-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
        .toggle-row button {
            background: transparent; border: none; color: var(--text-muted);
            font-family: var(--font-body); font-size: 0.9rem; cursor: pointer; padding: 8px 4px;
            border-bottom: 2px solid transparent;
        }
        .toggle-row button.active { color: var(--text-color); border-color: var(--accent-rose); }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a href="index.html" class="app-logo">
                <img src="assets/logo-icon.jpg" alt="Aymora">
                <span>aymora</span>
            </a>
            <nav class="app-nav" id="app-nav" style="display:none;"></nav>
        </header>
        <main id="app-content"></main>
    </div>

    <script>
        const API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
            ? 'http://localhost:8787'
            : 'https://aymora-api.onrender.com';

        const state = { user: null, view: 'auth', questionnaire: null, matches: [], activeConversationId: null };

        // --- Token storage + authenticated fetch with one-shot refresh ---

        function getTokens() {
            return {
                access: localStorage.getItem('aymora_access_token'),
                refresh: localStorage.getItem('aymora_refresh_token'),
            };
        }

        function setTokens(access, refresh) {
            localStorage.setItem('aymora_access_token', access);
            localStorage.setItem('aymora_refresh_token', refresh);
        }

        function clearSession() {
            localStorage.removeItem('aymora_access_token');
            localStorage.removeItem('aymora_refresh_token');
            localStorage.removeItem('aymora_user');
            state.user = null;
        }

        async function authFetch(path, opts = {}, isRetry = false) {
            const { access } = getTokens();
            const headers = { ...(opts.headers || {}) };
            if (access) headers['Authorization'] = `Bearer ${access}`;
            if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';

            const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });

            if (res.status === 401 && !isRetry) {
                const refreshed = await tryRefresh();
                if (refreshed) return authFetch(path, opts, true);
                clearSession();
                renderApp();
                throw new Error('session expired');
            }

            return res;
        }

        async function tryRefresh() {
            const { refresh } = getTokens();
            if (!refresh) return false;
            try {
                const res = await fetch(`${API_BASE}/api/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refresh }),
                });
                if (!res.ok) return false;
                const data = await res.json();
                setTokens(data.access_token, data.refresh_token);
                return true;
            } catch {
                return false;
            }
        }

        // --- Root render ---

        async function renderApp() {
            const nav = document.getElementById('app-nav');
            const content = document.getElementById('app-content');
            const { access } = getTokens();

            if (!access) {
                nav.style.display = 'none';
                renderAuthView(content);
                return;
            }

            if (!state.user) {
                try {
                    const res = await authFetch('/api/me');
                    if (!res.ok) throw new Error('not found');
                    state.user = await res.json();
                } catch {
                    clearSession();
                    nav.style.display = 'none';
                    renderAuthView(content);
                    return;
                }
            }

            nav.style.display = 'flex';
            renderNav(nav);
            renderView(content);
        }

        function renderNav(nav) {
            const views = [
                { id: 'questionnaire', label: 'Questionnaire' },
                { id: 'matches', label: 'Matches' },
                { id: 'chat', label: 'Chat' },
            ];
            nav.innerHTML = views.map(v =>
                `<button data-view="${v.id}" class="${state.view === v.id ? 'active' : ''}">${v.label}</button>`
            ).join('') + `<button id="logout-btn">Log out</button>`;

            views.forEach(v => {
                nav.querySelector(`[data-view="${v.id}"]`).addEventListener('click', () => {
                    state.view = v.id;
                    renderApp();
                });
            });
            document.getElementById('logout-btn').addEventListener('click', async () => {
                const { refresh } = getTokens();
                if (refresh) {
                    fetch(`${API_BASE}/api/auth/logout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh_token: refresh }),
                    }).catch(() => {});
                }
                clearSession();
                state.view = 'auth';
                renderApp();
            });
        }

        function renderView(content) {
            if (state.view === 'questionnaire') return renderQuestionnaireView(content);
            if (state.view === 'matches') return renderMatchesView(content);
            if (state.view === 'chat') return renderChatView(content);
            state.view = 'questionnaire';
            renderQuestionnaireView(content);
        }

        // --- Auth view (signup / login toggle) ---

        function renderAuthView(content) {
            content.innerHTML = `
                <div class="card" style="max-width: 460px; margin: 40px auto;">
                    <div class="toggle-row">
                        <button id="tab-signup" class="active">Sign up</button>
                        <button id="tab-login">Log in</button>
                    </div>
                    <div id="auth-form-area"></div>
                </div>
            `;
            document.getElementById('tab-signup').addEventListener('click', () => showAuthTab('signup'));
            document.getElementById('tab-login').addEventListener('click', () => showAuthTab('login'));
            showAuthTab('signup');
        }

        function showAuthTab(tab) {
            document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            const area = document.getElementById('auth-form-area');
            area.innerHTML = tab === 'signup' ? signupFormHtml() : loginFormHtml();

            if (tab === 'signup') {
                document.getElementById('signup-form').addEventListener('submit', handleSignup);
            } else {
                document.getElementById('login-form').addEventListener('submit', handleLogin);
            }
        }

        function signupFormHtml() {
            // Explicit min/max on the date input: without these, Safari's
            // native <input type="date"> validity check can misfire ("Invalid
            // value") on well-formed dates mid-entry. max also client-side
            // enforces the 18+ rule the server checks anyway.
            const today = new Date();
            const maxDob = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate())
                .toISOString().slice(0, 10);
            const minDob = new Date(today.getFullYear() - 100, today.getMonth(), today.getDate())
                .toISOString().slice(0, 10);

            return `
                <form id="signup-form">
                    <div id="signup-msg"></div>
                    <div class="field"><label>Name</label><input type="text" id="su-name" required maxlength="60"></div>
                    <div class="field"><label>Email</label><input type="email" id="su-email" required></div>
                    <div class="field"><label>Date of birth</label><input type="date" id="su-dob" required min="${minDob}" max="${maxDob}"></div>
                    <div class="field"><label>Gender</label>
                        <select id="su-gender">
                            <option value="woman">Woman</option>
                            <option value="man">Man</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="field"><label>Interested in</label>
                        <div class="checkbox-row"><input type="checkbox" id="su-seek-woman" value="woman"><label for="su-seek-woman">Women</label></div>
                        <div class="checkbox-row"><input type="checkbox" id="su-seek-man" value="man"><label for="su-seek-man">Men</label></div>
                        <div class="checkbox-row"><input type="checkbox" id="su-seek-other" value="other"><label for="su-seek-other">Other</label></div>
                    </div>
                    <div class="field"><label>City</label><input type="text" id="su-city"></div>
                    <button type="submit" class="btn btn-primary btn-block">Create account</button>
                </form>
            `;
        }

        function loginFormHtml() {
            return `
                <form id="login-form">
                    <div id="login-msg"></div>
                    <div class="field"><label>Email</label><input type="email" id="li-email" required></div>
                    <button type="submit" class="btn btn-primary btn-block">Send sign-in link</button>
                </form>
            `;
        }

        async function handleSignup(e) {
            e.preventDefault();
            const msg = document.getElementById('signup-msg');
            const btn = e.target.querySelector('button');
            const seeking = ['woman', 'man', 'other'].filter(g => document.getElementById(`su-seek-${g}`).checked);

            btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('su-email').value,
                        display_name: document.getElementById('su-name').value,
                        date_of_birth: document.getElementById('su-dob').value,
                        gender: document.getElementById('su-gender').value,
                        seeking,
                        city: document.getElementById('su-city').value || undefined,
                    }),
                });
                if (res.status === 202) {
                    msg.innerHTML = '<div class="msg msg-success">Check your email for a sign-in link.</div>';
                    e.target.querySelectorAll('input, select, button').forEach(el => el.disabled = true);
                } else {
                    const data = await res.json().catch(() => ({}));
                    msg.innerHTML = `<div class="msg msg-error">${data.error === 'must_be_18_or_older' ? 'You must be 18 or older to join.' : 'Something went wrong. Please try again.'}</div>`;
                    btn.disabled = false;
                }
            } catch {
                msg.innerHTML = '<div class="msg msg-error">Could not reach the server.</div>';
                btn.disabled = false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const msg = document.getElementById('login-msg');
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            try {
                await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('li-email').value }),
                });
                msg.innerHTML = '<div class="msg msg-success">If that email has an account, a sign-in link is on its way.</div>';
                e.target.querySelectorAll('input, button').forEach(el => el.disabled = true);
            } catch {
                msg.innerHTML = '<div class="msg msg-error">Could not reach the server.</div>';
                btn.disabled = false;
            }
        }

        // --- Questionnaire view ---

        async function renderQuestionnaireView(content) {
            content.innerHTML = '<div class="spinner"></div>';
            let data;
            try {
                const res = await authFetch('/api/questionnaire');
                if (!res.ok) throw new Error('failed');
                data = await res.json();
            } catch {
                content.innerHTML = '<div class="msg msg-error">Could not load the questionnaire.</div>';
                return;
            }
            state.questionnaire = data;

            if (data.completed) {
                content.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <span class="section-label">Questionnaire</span>
                        <h2 class="font-display">You're all set.</h2>
                        <p style="color: var(--text-muted); margin: 16px 0 24px;">
                            ${state.user.onboarding_status === 'invited' || state.user.onboarding_status === 'questionnaire_complete'
                                ? "We're building your personality profile — check back in a moment."
                                : "Your profile is ready. Head to Matches to see who's next."}
                        </p>
                        <button class="btn btn-secondary" id="requeue-btn">Refresh status</button>
                    </div>
                `;
                document.getElementById('requeue-btn').addEventListener('click', async () => {
                    const res = await authFetch('/api/me');
                    state.user = await res.json();
                    renderApp();
                });
                return;
            }

            const answers = data.answers || {};
            content.innerHTML = `
                <span class="section-label">Questionnaire</span>
                <h2 class="font-display" style="margin-bottom: 32px;">A few thoughtful questions.</h2>
                <div id="q-msg"></div>
                <form id="questionnaire-form" class="card">
                    ${data.schema.map(q => renderQuestion(q, answers[q.id])).join('<hr style="border-color: var(--border-color); margin: 24px 0;">')}
                </form>
                <div style="display:flex; gap: 12px; margin-top: 24px;">
                    <button class="btn btn-secondary" id="save-draft-btn">Save draft</button>
                    <button class="btn btn-primary" id="submit-btn" style="flex:1;">Submit</button>
                </div>
            `;

            attachQuestionnaireHandlers(data.schema);
            document.getElementById('save-draft-btn').addEventListener('click', () => submitQuestionnaire(data.schema, false));
            document.getElementById('submit-btn').addEventListener('click', () => submitQuestionnaire(data.schema, true));
        }

        function renderQuestion(q, existingAnswer) {
            if (q.type === 'likert') {
                const [min, max] = q.scale;
                const options = [];
                for (let i = min; i <= max; i++) options.push(i);
                return `
                    <div class="field" data-qid="${q.id}" data-qtype="likert">
                        <label>${q.prompt}</label>
                        <div class="likert-row">
                            ${options.map(v => `<button type="button" data-value="${v}" class="${existingAnswer === v ? 'selected' : ''}">${v}</button>`).join('')}
                        </div>
                    </div>
                `;
            }
            if (q.type === 'single_select') {
                return `
                    <div class="field" data-qid="${q.id}" data-qtype="single_select">
                        <label>${q.prompt}</label>
                        ${q.options.map(opt => `
                            <div class="radio-row">
                                <input type="radio" name="${q.id}" value="${opt}" id="${q.id}-${opt}" ${existingAnswer === opt ? 'checked' : ''}>
                                <label for="${q.id}-${opt}">${opt}</label>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            if (q.type === 'multi_select') {
                const selected = Array.isArray(existingAnswer) ? existingAnswer : [];
                return `
                    <div class="field" data-qid="${q.id}" data-qtype="multi_select" data-max="${q.maxSelect || ''}">
                        <label>${q.prompt}</label>
                        ${q.options.map(opt => `
                            <div class="checkbox-row">
                                <input type="checkbox" value="${opt}" id="${q.id}-${opt}" ${selected.includes(opt) ? 'checked' : ''}>
                                <label for="${q.id}-${opt}">${opt}</label>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            // free_text
            return `
                <div class="field" data-qid="${q.id}" data-qtype="free_text">
                    <label>${q.prompt}</label>
                    <textarea>${existingAnswer || ''}</textarea>
                </div>
            `;
        }

        function attachQuestionnaireHandlers(schema) {
            schema.forEach(q => {
                const el = document.querySelector(`[data-qid="${q.id}"]`);
                if (q.type === 'likert') {
                    el.querySelectorAll('button').forEach(btn => {
                        btn.addEventListener('click', () => {
                            el.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                        });
                    });
                }
                if (q.type === 'multi_select') {
                    const max = parseInt(el.dataset.max, 10);
                    if (max) {
                        el.querySelectorAll('input[type=checkbox]').forEach(cb => {
                            cb.addEventListener('change', () => {
                                const checked = el.querySelectorAll('input[type=checkbox]:checked');
                                if (checked.length > max) cb.checked = false;
                            });
                        });
                    }
                }
            });
        }

        function collectAnswers(schema) {
            const answers = {};
            schema.forEach(q => {
                const el = document.querySelector(`[data-qid="${q.id}"]`);
                if (q.type === 'likert') {
                    const selected = el.querySelector('button.selected');
                    if (selected) answers[q.id] = parseInt(selected.dataset.value, 10);
                } else if (q.type === 'single_select') {
                    const checked = el.querySelector('input[type=radio]:checked');
                    if (checked) answers[q.id] = checked.value;
                } else if (q.type === 'multi_select') {
                    answers[q.id] = Array.from(el.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);
                } else {
                    const val = el.querySelector('textarea').value.trim();
                    if (val) answers[q.id] = val;
                }
            });
            return answers;
        }

        async function submitQuestionnaire(schema, complete) {
            const msg = document.getElementById('q-msg');
            const answers = collectAnswers(schema);
            try {
                const patchRes = await authFetch('/api/questionnaire/responses', {
                    method: 'PATCH',
                    body: JSON.stringify({ answers }),
                });
                if (!patchRes.ok) throw new Error('save failed');

                if (!complete) {
                    msg.innerHTML = '<div class="msg msg-success">Draft saved.</div>';
                    return;
                }

                const completeRes = await authFetch('/api/questionnaire/responses/complete', { method: 'POST' });
                if (!completeRes.ok) {
                    const data = await completeRes.json().catch(() => ({}));
                    msg.innerHTML = `<div class="msg msg-error">${data.error === 'no_answers_submitted' ? 'Please answer at least one question first.' : 'Something went wrong.'}</div>`;
                    return;
                }

                const meRes = await authFetch('/api/me');
                state.user = await meRes.json();
                renderApp();
            } catch {
                msg.innerHTML = '<div class="msg msg-error">Could not reach the server.</div>';
            }
        }

        // --- Matches view ---

        async function renderMatchesView(content) {
            content.innerHTML = '<div class="spinner"></div>';
            let res;
            try {
                res = await authFetch('/api/matches/next');
            } catch {
                content.innerHTML = '<div class="msg msg-error">Could not load matches.</div>';
                return;
            }

            if (res.status === 204) {
                content.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <span class="section-label">Matches</span>
                        <h2 class="font-display">No one new right now.</h2>
                        <p style="color: var(--text-muted); margin-top: 12px;">
                            Check back soon — new introductions are generated as more people join and finish their profiles.
                        </p>
                    </div>
                `;
                return;
            }

            if (!res.ok) {
                content.innerHTML = '<div class="msg msg-error">Could not load matches.</div>';
                return;
            }

            const next = await res.json();
            const c = next.candidate || {};
            content.innerHTML = `
                <span class="section-label">Matches</span>
                <h2 class="font-display" style="margin-bottom: 24px;">One intentional introduction.</h2>
                <div id="match-msg"></div>
                <div class="card match-card">
                    <h3 class="font-display" style="font-size: 1.6rem; margin-bottom: 8px;">${escapeHtml(c.display_name || 'Someone new')}${c.city ? ` &middot; ${escapeHtml(c.city)}` : ''}</h3>
                    <p style="color: var(--text-muted);">${escapeHtml(c.summary || '')}</p>
                    <div class="core-values">${(c.core_values || []).map(v => `<span>${escapeHtml(v)}</span>`).join('')}</div>
                    <div class="match-actions">
                        <button class="btn btn-secondary" id="pass-btn">Pass</button>
                        <button class="btn btn-primary" id="interested-btn">Interested</button>
                    </div>
                </div>
            `;

            document.getElementById('pass-btn').addEventListener('click', () => decideMatch(next.candidateId, false));
            document.getElementById('interested-btn').addEventListener('click', () => decideMatch(next.candidateId, true));
        }

        async function decideMatch(candidateId, interested) {
            const msg = document.getElementById('match-msg');
            try {
                const res = await authFetch(`/api/matches/${candidateId}/decide`, {
                    method: 'POST',
                    body: JSON.stringify({ interested }),
                });
                const data = await res.json();
                if (data.outcome === 'mutual_match') {
                    msg.innerHTML = '<div class="msg msg-success">It\'s mutual! Check Chat to say hello.</div>';
                    setTimeout(() => renderMatchesView(document.getElementById('app-content')), 1500);
                } else {
                    renderMatchesView(document.getElementById('app-content'));
                }
            } catch {
                msg.innerHTML = '<div class="msg msg-error">Could not reach the server.</div>';
            }
        }

        // --- Chat view ---

        async function renderChatView(content) {
            content.innerHTML = '<div class="spinner"></div>';
            let matches;
            try {
                const res = await authFetch('/api/matches');
                if (!res.ok) throw new Error('failed');
                matches = (await res.json()).matches;
            } catch {
                content.innerHTML = '<div class="msg msg-error">Could not load matches.</div>';
                return;
            }
            state.matches = matches;

            if (matches.length === 0) {
                content.innerHTML = `
                    <span class="section-label">Chat</span>
                    <div class="card" style="text-align:center;">
                        <p style="color: var(--text-muted);">No conversations yet — mutual matches show up here.</p>
                    </div>
                `;
                return;
            }

            if (!state.activeConversationId) state.activeConversationId = matches[0].conversation_id;
            const active = matches.find(m => m.conversation_id === state.activeConversationId) || matches[0];

            content.innerHTML = `
                <span class="section-label">Chat</span>
                <div style="display:grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: start;">
                    <div>
                        ${matches.map(m => `
                            <div class="match-list-item" data-cid="${m.conversation_id}" style="${m.conversation_id === active.conversation_id ? 'border-color: var(--accent-rose);' : ''}">
                                <span>${escapeHtml(m.other_display_name || 'Match')}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="card">
                        <h3 class="font-display" style="margin-bottom: 16px;">${escapeHtml(active.other_display_name || 'Match')}</h3>
                        <div class="messages-pane" id="messages-pane"><div class="spinner"></div></div>
                        <form id="message-form" class="message-form">
                            <input type="text" id="message-input" placeholder="Say hello…" maxlength="4000" required>
                            <button type="submit" class="btn btn-primary">Send</button>
                        </form>
                    </div>
                </div>
            `;

            document.querySelectorAll('.match-list-item').forEach(el => {
                el.addEventListener('click', () => {
                    state.activeConversationId = el.dataset.cid;
                    renderChatView(content);
                });
            });
            document.getElementById('message-form').addEventListener('submit', handleSendMessage);

            loadMessages(active.conversation_id, active.other_display_name);
        }

        async function loadMessages(conversationId, otherName) {
            const pane = document.getElementById('messages-pane');
            try {
                const res = await authFetch(`/api/conversations/${conversationId}/messages`);
                const data = await res.json();
                const messages = (data.messages || []).slice().reverse();
                pane.innerHTML = messages.length
                    ? messages.map(m => `<div class="message-bubble ${m.sender_id === state.user.id ? 'message-mine' : 'message-theirs'}">${escapeHtml(m.body)}</div>`).join('')
                    : `<div style="color: var(--text-muted); text-align:center; padding: 20px 0;">Say hello to ${escapeHtml(otherName || 'your match')}.</div>`;
                pane.scrollTop = pane.scrollHeight;
            } catch {
                pane.innerHTML = '<div class="msg msg-error">Could not load messages.</div>';
            }
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const body = input.value.trim();
            if (!body) return;
            input.value = '';
            try {
                await authFetch(`/api/conversations/${state.activeConversationId}/messages`, {
                    method: 'POST',
                    body: JSON.stringify({ body }),
                });
                const active = state.matches.find(m => m.conversation_id === state.activeConversationId);
                loadMessages(state.activeConversationId, active && active.other_display_name);
            } catch {
                // leave the input cleared; user can retype if it genuinely failed
            }
        }

        // --- Utilities ---

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        renderApp();
    </script>
</body>
</html>
