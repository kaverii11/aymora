services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aymora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aymora
      POSTGRES_PASSWORD: aymora_dev_password
      POSTGRES_DB: aymora
    ports:
      - "5432:5432"
    volumes:
      - aymora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aymora -d aymora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aymora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aymora_pg_data:
